name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install --group lint
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }}${{ matrix.opencv && format(', OpenCV {0}', matrix.opencv) || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported Python with the oldest supported OpenCV (first one built for NumPy 2).
          - { os: ubuntu-latest, python: "3.9", opencv: "4.10.0.84" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.15" }
          # Windows is where OpenCV's own file functions break on non-ASCII paths.
          - { os: windows-latest, python: "3.15" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install the package and test tools
        run: |
          python -m pip install --upgrade pip
          pip install . --group test
      - name: Pin OpenCV
        if: matrix.opencv
        run: pip install "opencv-python-headless==${{ matrix.opencv }}"
      - name: Show versions
        run: python -c "import cv2, numpy, sys; print(sys.version); print('OpenCV', cv2.__version__, 'NumPy', numpy.__version__)"
      - run: pytest -v
      - name: Smoke-test the installed command
        run: |
          face-wall --version
          face-wall 6 3 smoke.jpg --seed 1
          face-wall 4 1 smoke-crop.jpg --faces examples/portraits --crop-faces

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Build the sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Check the wheel ships the face detector model
        run: python -m zipfile -l dist/*.whl | grep -E "face_wall/models/.+\.onnx"
